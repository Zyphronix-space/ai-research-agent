name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest -q

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-research-agent-backend ./backend

      - name: Smoke test — container boots and /health responds
        run: |
          docker run -d -p 8000:8000 -e GEMINI_API_KEY=dummy-key-for-ci --name backend ai-research-agent-backend
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8000/health; then
              echo "backend is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "backend never became healthy"
          docker logs backend
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx oxlint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t ai-research-agent-frontend ./frontend
